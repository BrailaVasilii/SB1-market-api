version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sb1-postgres
    environment:
      POSTGRES_DB: sb1_market_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - sb1_postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sb1-network

  redis:
    image: redis:7-alpine
    container_name: sb1-redis
    ports:
      - "6380:6379"
    volumes:
      - sb1_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - sb1-network

  web:
    build: .
    container_name: sb1-web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - sb1_static:/app/static
      - sb1_media:/app/media
    ports:
      - "8001:8000"
    environment:
      - DOCKER_ENV=true
      - DB_NAME=sb1_market_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=django-insecure-docker-sb1-key-2024
      - DEBUG=True
      - ALLOWED_HOSTS=localhost,127.0.0.1,0.0.0.0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - sb1-network

  celery:
    build: .
    container_name: sb1-celery-worker
    command: celery -A config worker -l info
    volumes:
      - .:/app
    environment:
      - DOCKER_ENV=true
      - DB_NAME=sb1_market_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped
    networks:
      - sb1-network

  celery-beat:
    build: .
    container_name: sb1-celery-beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    environment:
      - DOCKER_ENV=true
      - DB_NAME=sb1_market_db
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_HOST=db
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - web
    restart: unless-stopped
    networks:
      - sb1-network

volumes:
  sb1_postgres_data:
  sb1_redis_data:
  sb1_static:
  sb1_media:

networks:
  sb1-network:
    driver: bridge