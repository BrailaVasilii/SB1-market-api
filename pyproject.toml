[project]
name = "sb1-market-api"
version = "1.0.0"
description = "Backend API для доски объявлений (SB1 Diploma Project)"
authors = [
    {name = "Vasili Braila", email = "vbraila@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"

dependencies = [
    # Django ecosystem
    "django>=5.2.6,<6.0.0",
    "djangorestframework>=3.16.1,<4.0.0",
    "django-filter>=25.1,<26.0",
    "django-cors-headers>=4.3.0,<5.0.0",
    "drf-spectacular>=0.28.0,<0.29.0",

    # Authentication
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "djoser>=2.2.0,<3.0.0",

    # Database
    "psycopg2-binary>=2.9.10,<3.0.0",

    # Async tasks
    "celery>=5.5.3,<6.0.0",
    "redis>=6.4.0,<7.0.0",
    "django-celery-beat>=2.8.1,<3.0.0",

    # Utilities
    "python-decouple>=3.8,<4.0",
    "pillow>=10.0.0,<11.0.0",
]

[tool.poetry]
packages = [{include = "sb1_market_api", from = "src"}]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.8.0"
pytest-cov = "^4.1.0"
coverage = "^7.10.7"
factory-boy = "^3.3.0"
flake8 = "^7.3.0"
autopep8 = "^2.3.2"
black = "^24.0.0"
isort = "^5.13.0"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--cov=. --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "*/tests/*", "*/venv/*", "*/.venv/*", "manage.py"]

[tool.coverage.report]
precision = 2
show_missing = true

[tool.black]
line-length = 120
target-version = ['py312']
exclude = '''/(\.git|\.venv|migrations|__pycache__)/'''

[tool.isort]
profile = "black"
line_length = 120
skip_glob = ["*/migrations/*"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
