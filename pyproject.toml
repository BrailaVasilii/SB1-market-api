[tool.poetry]
name = "sb1-market-api"
version = "1.0.0"
description = "Backend API для доски объявлений (SB1 Diploma Project)"
authors = ["Vasili Braila <vbraila@gmail.com>"]
readme = "README.md"
packages = []

[tool.poetry.dependencies]
python = "^3.12"

# Django ecosystem
django = "^5.2.6"
djangorestframework = "^3.16.1"
django-filter = "^25.1"
django-cors-headers = "^4.3.0"
drf-spectacular = "^0.28.0"

# Authentication
djangorestframework-simplejwt = "^5.5.1"
djoser = "^2.2.0"

# Database
psycopg2-binary = "^2.9.10"

# Async tasks
celery = "^5.5.3"
redis = "^6.4.0"
django-celery-beat = "^2.8.1"

# Utilities
python-decouple = "^3.8"
pillow = "^10.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-django = "^4.9.0"
pytest-cov = "^6.0.0"
black = "^24.0.0"
flake8 = "^7.0.0"
isort = "^5.13.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"